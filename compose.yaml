services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_relay
      POSTGRES_USER: agent_relay
      POSTGRES_PASSWORD: agent_relay
    # For local development, uncomment the following lines to expose the PostgreSQL port
    # ports:
    #   - "5630:5432"      
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_relay -d agent_relay"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-relay:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@postgres:5432/agent_relay
    ports:
      - "8000:8000"

volumes:
  postgres-data: